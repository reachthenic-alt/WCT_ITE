<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number to string converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .converter-container {
            background-color: #fca635; /* Orange background matching the image */
            padding: 40px;
            width: 350px;
            text-align: center;
        }
        .converter-container h2 {
            color: #4a5568;
            font-weight: normal;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .converter-container input {
            width: 80%;
            padding: 10px;
            margin-bottom: 20px;
            border: none;
            box-sizing: border-box;
        }
        .converter-container button {
            padding: 10px 30px;
            border: none;
            background-color: white;
            color: black;
            font-size: 16px;
            cursor: pointer;
        }
        .converter-container button:hover {
            background-color: #f0f0f0;
        }
        #output {
            margin-top: 20px;
            color: #d90429; /* Red text for the output */
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Task 1 UI elements -->
    <div class="converter-container">
        <h2>Number to string converter</h2>
        <input type="number" id="numberInput" placeholder="Enter number">
        <br>
        <button onclick="convertNumberToString()">Convert</button>
    </div>

    <!-- Container for displaying the output -->
    <p id="output"></p>

    <script>
        // JavaScript logic for Task 1
        function convertNumberToString() {
            // Get the value from the input field
            const numStr = document.getElementById('numberInput').value;
            const digitWords = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine"];
            let result = "";
            
            // Loop through each digit in the input string
            for (let i = 0; i < numStr.length; i++) {
                let digit = parseInt(numStr[i]);
                
                // If it's a valid number, append the corresponding word
                if (!isNaN(digit)) {
                    result += digitWords[digit];
                }
            }
            
            // Display the result on the page
            document.getElementById('output').innerText = result;
        }
    </script>

</body>
</html>
